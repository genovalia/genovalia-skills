apiVersion: apps/v1
kind: Deployment

metadata:
    name: __APP__
    labels:
        app: __APP__
spec:
    replicas: 1
    revisionHistoryLimit: 3
    progressDeadlineSeconds: 600
    # spec.selector is immutable on a live Deployment: select on `app` only
    # (each overlay sets its value), never add another label here later.
    selector:
        matchLabels:
            app: __APP__
    strategy:
        # Recreate instead if the pod mounts a ReadWriteOnce PVC.
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
    template:
        metadata:
            labels:
                app: __APP__
        spec:
            containers:
                - name: __APP__
                  # Placeholder: each overlay's `images:` sets the real one.
                  image: __APP__
                  ports:
                      - containerPort: __PORT__
                        protocol: TCP
                  # Both generated by the overlay from the target's GitHub
                  # Environment; kustomize renames these references.
                  envFrom:
                      - configMapRef:
                            name: __APP__
# >>> secrets
                      - secretRef:
                            name: __APP__-secrets
# <<< secrets
                  # Check the namespace LimitRange floor before going lower:
                  # oc get limitrange -n <namespace> -o yaml
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          cpu: 300m
                          memory: 512Mi
                  readinessProbe:
                      httpGet:
                          path: __HEALTH__
                          port: __PORT__
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: __HEALTH__
                          port: __PORT__
                      initialDelaySeconds: 15
                      periodSeconds: 20
            restartPolicy: Always
            terminationGracePeriodSeconds: 30
            dnsPolicy: ClusterFirst
            schedulerName: default-scheduler
