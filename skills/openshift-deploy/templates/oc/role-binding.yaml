# Bootstrap-only (deploy.py skips it): applied once by a namespace admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: github-ci-__APP__
    namespace: __NS__
    labels:
        app: __NAME__
subjects:
    - kind: ServiceAccount
      name: github-ci-__APP__
      namespace: __NS__
roleRef:
    kind: Role
    name: github-ci-__APP__
    apiGroup: rbac.authorization.k8s.io
