# Bootstrap-only (deploy.py skips it): applied once by a namespace admin.
# Everything the Deploy workflow touches, scoped by name to this app so CI
# cannot read or change the other apps of the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: github-ci-__APP__
    namespace: __NS__
    labels:
        app: __NAME__
rules:
    - apiGroups: ["apps"]
      resources: ["deployments"]
      verbs: ["get", "list", "watch", "update", "patch"]
      resourceNames: [__N_DEPLOYMENT__]
    # RBAC cannot restrict "create" by resourceNames (the object doesn't exist
    # yet, so there's nothing to match the name against) - it has to be its
    # own unscoped rule, or "create" is silently denied for the scoped rule
    # above. Same pattern for every resource below.
    - apiGroups: ["apps"]
      resources: ["deployments"]
      verbs: ["create"]
    - apiGroups: [""]
      resources: ["services"]
      verbs: ["get", "list", "watch", "update", "patch"]
      resourceNames: [__N_SERVICE__]
    - apiGroups: [""]
      resources: ["services"]
      verbs: ["create"]
    # "Sync ConfigMap" step (oc create configmap ... | oc apply -f -).
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "list", "watch", "update", "patch"]
      resourceNames: [__N_CONFIGMAP__]
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["create"]
# >>> secrets
    # "Sync secrets" step (oc create secret ... | oc apply -f -).
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["get", "list", "watch", "update", "patch"]
      resourceNames: [__N_SECRET__]
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["create"]
# <<< secrets
    - apiGroups: ["route.openshift.io"]
      resources: ["routes"]
      verbs: ["get", "list", "watch", "update", "patch"]
      resourceNames: [__N_ROUTE__]
    - apiGroups: ["route.openshift.io"]
      resources: ["routes"]
      verbs: ["create"]
    # A Route with an explicit spec.host is gated behind this subresource.
    # "create" only: the admin ClusterRole itself grants no "update" here,
    # so asking for it is self-escalation and the Role is refused.
    - apiGroups: ["route.openshift.io"]
      resources: ["routes/custom-host"]
      verbs: ["create"]
    # The registry creates the ImageStream on first push.
    - apiGroups: ["image.openshift.io"]
      resources: ["imagestreams"]
      verbs: ["get", "list", "watch", "update", "patch"]
      resourceNames: [__N_IMAGE__]
    - apiGroups: ["image.openshift.io"]
      resources: ["imagestreams"]
      verbs: ["create"]
    - apiGroups: ["image.openshift.io"]
      resources: ["imagestreams/layers"]
      verbs: ["get", "update"]
      resourceNames: [__N_IMAGE__]
    # rollout status
    - apiGroups: [""]
      resources: ["pods", "replicationcontrollers"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["replicasets"]
      verbs: ["get", "list", "watch"]
