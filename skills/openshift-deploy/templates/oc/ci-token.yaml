# Bootstrap-only (deploy.py skips it): applied once by a namespace admin.
# Long-lived token for the CI service account, copied into the GitHub
# Environment as OPENSHIFT_TOKEN. Rotate by deleting this Secret and applying
# it again (OpenShift issues a new token), then re-copy it to GitHub.
apiVersion: v1
kind: Secret
metadata:
    name: github-ci-__APP__-token
    namespace: __NS__
    labels:
        app: __NAME__
    annotations:
        kubernetes.io/service-account.name: github-ci-__APP__
type: kubernetes.io/service-account-token
