apiVersion: apps/v1
kind: Deployment

metadata:
    name: __NAME__
    namespace: __NS__
    labels:
        app: __NAME__
        environment: __ENV__
spec:
    replicas: 1
    revisionHistoryLimit: 3
    progressDeadlineSeconds: 600
    # spec.selector is immutable on a live Deployment: select on `app` only,
    # never add another label here after the first deploy.
    selector:
        matchLabels:
            app: __NAME__
    strategy:
        # Recreate instead if the pod mounts a ReadWriteOnce PVC.
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
    template:
        metadata:
            labels:
                app: __NAME__
                environment: __ENV__
        spec:
            containers:
                - name: __APP__
                  image: registre.apps.ul-pca-pr-ul01.ulaval.ca/__NS__/__NAME__:latest
                  ports:
                      - containerPort: __PORT__
                        protocol: TCP
                  # Both synced from the GitHub Environment by the Deploy workflow.
                  envFrom:
                      - configMapRef:
                            name: __NAME__
# >>> secrets
                      - secretRef:
                            name: __NAME__-secrets
# <<< secrets
# >>> sentry
                  # Pinned here, never a GitHub variable: Sentry alert rules
                  # match on exactly "dev" / "prod".
                  env:
                      - name: SENTRY_ENVIRONMENT
                        value: __ENV__
# <<< sentry
                  # Check the namespace LimitRange floor before going lower:
                  # oc get limitrange -n __NS__ -o yaml
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          cpu: 300m
                          memory: 512Mi
                  readinessProbe:
                      httpGet:
                          path: __HEALTH__
                          port: __PORT__
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: __HEALTH__
                          port: __PORT__
                      initialDelaySeconds: 15
                      periodSeconds: 20
            restartPolicy: Always
            terminationGracePeriodSeconds: 30
            dnsPolicy: ClusterFirst
            schedulerName: default-scheduler
