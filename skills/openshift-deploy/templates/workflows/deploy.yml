name: Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (matches deploy.py ENVIRONMENTS)"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    runs-on:
      group: 'ul-git-pr-resul-recherche-runners'
    timeout-minutes: 20
    permissions:
      contents: write  # push the release tag after a prod deploy
    # Push to dev deploys "dev", push to main deploys "prod". A manual run
    # picks the env explicitly instead. dev and prod are separate OpenShift
    # namespaces: each GitHub Environment holds its own OPENSHIFT_CLUSTER /
    # OPENSHIFT_NAMESPACE vars and OPENSHIFT_TOKEN secret.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
    # One deploy at a time per target, whatever ref it comes from.
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
      # Name of every resource of the target env (deploy.py ENVIRONMENTS).
      RESOURCE_NAME: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev')) == 'prod' && '__APP__' || '__APP__-dev' }}

    steps:
      - uses: actions/checkout@v4

      # deploy.py drives `oc` directly (rollout), so it must be on PATH.
      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1.13.1
        with:
          oc: latest

      - name: Authenticate and set context
        uses: redhat-actions/oc-login@v1.3
        with:
          openshift_server_url: ${{ vars.OPENSHIFT_CLUSTER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ vars.OPENSHIFT_NAMESPACE }}

      # GitHub is the source of truth for these values, not the ConfigMap/Secret
      # or this repo: synced into OpenShift every deploy so a change here
      # takes effect on the next push, no manual `oc` step.
# >>> secrets
      - name: Sync secrets
        env:
@@SECRET_ENV@@
        run: |
          missing=0
          for k in @@SECRET_REQUIRED@@; do
            [ -n "${!k}" ] || { echo "::error::secret $k is empty in the $DEPLOY_ENV environment"; missing=1; }
          done
          [ "$missing" = 0 ]
          args=(
@@SECRET_ARGS@@
          )
@@SECRET_OPTIONAL@@
          oc create secret generic "$RESOURCE_NAME-secrets" "${args[@]}" \
            --dry-run=client -o yaml | oc apply -f -

# <<< secrets
      - name: Sync ConfigMap
        env:
@@CONFIG_ENV@@
        run: |
          missing=0
          for k in @@CONFIG_REQUIRED@@; do
            [ -n "${!k}" ] || { echo "::error::variable $k is empty in the $DEPLOY_ENV environment"; missing=1; }
          done
          [ "$missing" = 0 ]
          args=(
@@CONFIG_ARGS@@
          )
          # Optional keys: only sent when set, so an empty value never
          # overrides the app's own default (e.g. int("") for a port).
@@CONFIG_OPTIONAL@@
          oc create configmap "$RESOURCE_NAME" "${args[@]}" \
            --dry-run=client -o yaml | oc apply -f -

      # deploy.py sees the session from the login step and skips its own
      # login; it still handles build, push, `oc apply` of oc/<env>/ (minus
      # the bootstrap-only RBAC files), and rollout restart/status itself.
      - name: Build, push and apply
        id: deploy
        env:
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: python3 deploy.py "$DEPLOY_ENV" --token "$OPENSHIFT_TOKEN" --non-interactive

      - name: Tag version
        # Guard on the branch too, not just the target environment: a manual
        # workflow_dispatch can deploy "prod" from any ref, and tagging that
        # commit would mislabel a release that wasn't actually built from main.
        if: success() && steps.deploy.outputs.environment == 'prod' && github.ref_name == 'main'
        run: |
          TAG="v${{ steps.deploy.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "${{ steps.deploy.outputs.environment == 'prod' && 'deployment-prod' || 'deployment-dev' }}"
            text: ":rocket: *__APP__* deployed — version `${{ steps.deploy.outputs.version }}` to *${{ steps.deploy.outputs.environment }}* (`${{ steps.deploy.outputs.deployment }}`)"

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "github-ci"
            text: ":x: *${{ github.event.repository.name }}* — `Deploy` failed for *${{ env.DEPLOY_ENV }}* (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|logs>)"
